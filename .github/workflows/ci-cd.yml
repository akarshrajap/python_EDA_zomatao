name: CI/CD Telemetry Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/data-telemetry-dashboard

jobs:
  # -------------------------------------------------------------
  # Job 1: Lint, Code Analysis & Unit Tests
  # -------------------------------------------------------------
  lint-and-test:
    name: Lint & Data Ingestion Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest
          pip install -r requirements.txt

      - name: Code Quality & Lint Checks
        run: |
          # Stop build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --exclude=.git,__pycache__
          # Exit-zero treats all errors as warnings
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics --exclude=.git,__pycache__

      - name: Test Data Schema & App Import
        run: |
          python -c "
          import pandas as pd
          import os
          data_file = 'data/telemetry_data.csv'
          assert os.path.exists(data_file), 'telemetry_data.csv missing'
          df = pd.read_csv(data_file)
          assert not df.empty, 'telemetry_data.csv is empty'
          expected_cols = ['name', 'online_order', 'book_table', 'rating', 'votes', 'location', 'service_type', 'city_zone']
          for col in expected_cols:
              assert col in df.columns, f'Missing column: {col}'
          print('Dataset integrity passed: ', df.shape)
          "

  # -------------------------------------------------------------
  # Job 2: Build & Push Container Image
  # -------------------------------------------------------------
  build-and-push:
    name: Build & Push Docker Image
    needs: lint-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker Metadata & Tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # -------------------------------------------------------------
  # Job 3: Kubernetes Manifest Validation & Deployment
  # -------------------------------------------------------------
  k8s-validate:
    name: Validate Kubernetes Manifests
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'latest'

      - name: Validate K8s Manifests (Dry-run)
        run: |
          kubectl create --dry-run=client -f k8s/configmap.yaml -o yaml > /dev/null
          kubectl create --dry-run=client -f k8s/deployment.yaml -o yaml > /dev/null
          kubectl create --dry-run=client -f k8s/service.yaml -o yaml > /dev/null
          echo "All Kubernetes manifests successfully validated!"
