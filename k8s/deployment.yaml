apiVersion: apps/v1
kind: Deployment
metadata:
  name: telemetry-dashboard
  labels:
    app: telemetry-dashboard
    tier: frontend
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: telemetry-dashboard
  template:
    metadata:
      labels:
        app: telemetry-dashboard
        tier: frontend
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: telemetry-dashboard
          image: ghcr.io/akarsh/data-telemetry-dashboard:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8501
              name: http-streamlit
              protocol: TCP
          envFrom:
            - configMapRef:
                name: telemetry-dashboard-config
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          startupProbe:
            httpGet:
              path: /_stcore/health
              port: 8501
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 10
          livenessProbe:
            httpGet:
              path: /_stcore/health
              port: 8501
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /_stcore/health
              port: 8501
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 2
